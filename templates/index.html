<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Single and Playlist Downloader</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>🎬 YouTube Downloader</h1>
      <p class="subtitle">Get a direct download link for every video</p>

      <div class="form-card">
        <input
          type="text"
          id="url"
          placeholder="https://www.youtube.com/watch?v=... or playlist URL"
        />

        <div class="row">
          <div class="col">
            <label for="mode">Format</label>
            <select id="mode">
              <option value="mp4">MP4 (Video)</option>
              <option value="mp3">MP3 (Audio only)</option>
            </select>
          </div>
          <div class="col">
            <label for="quality">Quality</label>
            <select id="quality">
              <option value="720">720p (recommended for single link)</option>
              <option value="360">360p</option>
              <option value="best">Best pre-merged</option>
              <option value="worst">Worst</option>
            </select>
          </div>
        </div>

        <button id="goBtn">Get Download Links</button>
      </div>

      <div id="statusBox" class="status-box hidden"></div>
      <div id="linksBox" class="links-box hidden"></div>
      <div id="errorBox" class="error-box hidden"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
  </body>
</html>
